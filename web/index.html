<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <!-- No maximum-scale: people with low vision must be able to pinch-zoom. iOS Safari zooms into any field
         whose text is under 16px when it gets focus, which maximum-scale=1 used to hide -- so fields are 16px there. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#8A2F28" />
    <!-- Light-only design: tells browsers / Android WebViews (e.g. inside LINE) not to auto-darken the page. -->
    <meta name="color-scheme" content="light" />
    <meta name="description" content="บันทึกการบริจาคโลหิตของคุณ" />
    <!-- Mitr is served from our own /fonts (SIL Open Font License) instead of Google Fonts: no third-party
         request on every open (nothing sent to Google), and the font also works offline and inside the native
         app. The @font-face rules are inline so the browser can start fetching right away, in parallel with
         the JS bundle. Every weight x (Thai, Latin) pair the screens use is preloaded, so all of them arrive during
         the splash screen: left to unicode-range lazy loading, each pair was only fetched when a screen first
         needed it, and Thai text, digits and Latin letters swapped from the fallback font at different moments.
         (Latin-extended is rare and stays lazy.) -->
    <link rel="preload" href="/fonts/mitr-400-thai.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/mitr-600-thai.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/mitr-600-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/mitr-700-thai.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/mitr-700-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/mitr-400-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/mitr-500-thai.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/mitr-500-latin.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      @font-face{font-family:'Mitr';font-style:normal;font-weight:400;font-display:swap;src:url(/fonts/mitr-400-thai.woff2) format('woff2');unicode-range:U+02D7, U+0303, U+0331, U+0E01-0E5B, U+200C-200D, U+25CC}
      @font-face{font-family:'Mitr';font-style:normal;font-weight:400;font-display:swap;src:url(/fonts/mitr-400-latin-ext.woff2) format('woff2');unicode-range:U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF}
      @font-face{font-family:'Mitr';font-style:normal;font-weight:400;font-display:swap;src:url(/fonts/mitr-400-latin.woff2) format('woff2');unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD}
      @font-face{font-family:'Mitr';font-style:normal;font-weight:500;font-display:swap;src:url(/fonts/mitr-500-thai.woff2) format('woff2');unicode-range:U+02D7, U+0303, U+0331, U+0E01-0E5B, U+200C-200D, U+25CC}
      @font-face{font-family:'Mitr';font-style:normal;font-weight:500;font-display:swap;src:url(/fonts/mitr-500-latin-ext.woff2) format('woff2');unicode-range:U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF}
      @font-face{font-family:'Mitr';font-style:normal;font-weight:500;font-display:swap;src:url(/fonts/mitr-500-latin.woff2) format('woff2');unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD}
      @font-face{font-family:'Mitr';font-style:normal;font-weight:600;font-display:swap;src:url(/fonts/mitr-600-thai.woff2) format('woff2');unicode-range:U+02D7, U+0303, U+0331, U+0E01-0E5B, U+200C-200D, U+25CC}
      @font-face{font-family:'Mitr';font-style:normal;font-weight:600;font-display:swap;src:url(/fonts/mitr-600-latin-ext.woff2) format('woff2');unicode-range:U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF}
      @font-face{font-family:'Mitr';font-style:normal;font-weight:600;font-display:swap;src:url(/fonts/mitr-600-latin.woff2) format('woff2');unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD}
      @font-face{font-family:'Mitr';font-style:normal;font-weight:700;font-display:swap;src:url(/fonts/mitr-700-thai.woff2) format('woff2');unicode-range:U+02D7, U+0303, U+0331, U+0E01-0E5B, U+200C-200D, U+25CC}
      @font-face{font-family:'Mitr';font-style:normal;font-weight:700;font-display:swap;src:url(/fonts/mitr-700-latin-ext.woff2) format('woff2');unicode-range:U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF}
      @font-face{font-family:'Mitr';font-style:normal;font-weight:700;font-display:swap;src:url(/fonts/mitr-700-latin.woff2) format('woff2');unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD}
    </style>
    <!-- These resets used to live only in a <style> tag React renders --
         but the app's "loading" splash phase is a separate early-return
         that never renders that block at all, so for the ~2s the splash
         is on screen, the browser's default UA stylesheet (an 8px margin
         on <body>, a reserved scrollbar gutter) was back in effect: the
         exact "border on both sides" bug fixed elsewhere, reappearing
         specifically during loading, on every screen size (not just
         desktop) since it's not a viewport-width issue at all. Putting
         the resets here instead means they're active from the very first
         paint, before React mounts, no matter which phase renders. -->
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; }
      html, body { scrollbar-width: none; -ms-overflow-style: none; }
      html::-webkit-scrollbar, body::-webkit-scrollbar { display: none; width: 0; height: 0; }
      /* App-like text from the very first frame (splash included): no long-press selection / callout /
         tap flash. Text fields re-enabled explicitly (some iOS Safari versions inherit "none" and then
         refuse typing/pasting). The app re-opens reading content via .selectable once it renders. */
      html, body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
      @supports (-webkit-touch-callout: none) { input, textarea, select { font-size: 16px !important; } }
      input, textarea, select, [contenteditable="true"] { -webkit-user-select: text; user-select: text; -webkit-touch-callout: default; }
    </style>
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <!-- iOS "Add to Home Screen" support — Safari doesn't read manifest.json
         for its icon/name/standalone-mode, it needs these Apple-specific
         tags instead. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Blood Journey" />
    <title>Blood Journey</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
