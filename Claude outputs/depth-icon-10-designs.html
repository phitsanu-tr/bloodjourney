<!doctype html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ไอคอนมีมิติ — 10 แบบ</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" />
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #F3E9E7; font-family: 'Inter', sans-serif; padding: 28px 16px 60px; }
  h1 { font-family: 'Mitr', sans-serif; font-size: 19px; text-align: center; color: #241A18; margin: 0 0 4px; }
  .sub { text-align: center; font-size: 12.5px; color: #8A7370; margin: 0 0 28px; }
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 16px; max-width: 1080px; margin: 0 auto; }
  @media (max-width: 900px) { .grid { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 560px) { .grid { grid-template-columns: repeat(2, 1fr); } }
  .panel { background: #FBF6F5; border-radius: 18px; overflow: hidden; box-shadow: 0 8px 22px rgba(122,42,35,0.10); }
  .tag { text-align: center; font-size: 11px; font-weight: 700; padding: 9px 6px; background: #9A3B33; color: #FFF7F5; }
  .desc { font-size: 10.5px; color: #8A7370; text-align: center; padding: 6px 10px 0; line-height: 1.5; min-height: 44px; }
  .screen { height: 150px; display: flex; align-items: center; justify-content: center; }
  .card-icon { width: 92px; height: 92px; border-radius: 26px; background: #FFFFFF; box-shadow: 0 12px 26px rgba(154,59,51,0.14); display: flex; align-items: center; justify-content: center; }
  .foot { padding: 12px 0 16px; }
</style>
</head>
<body>
  <h1>ไอคอนหยดยิ้มให้มีมิติขึ้น — 10 แบบ</h1>
  <p class="sub">สำรวจเทคนิคเพิ่มความลึก: ไล่เฉดสี, ไฮไลต์มันวาว, เงา, นูน</p>
  <div class="grid" id="grid"></div>

<script>
const dropPath = "M12 2 C12 2 4 12.5 4 17 C4 21 7.6 24 12 24 C16.4 24 20 21 20 17 C20 12.5 12 2 12 2 Z";
const face = `
  <path d="M8 14.6 Q9.5 13.1 11 14.6" stroke="#FFF7F5" stroke-width="0.9" fill="none" stroke-linecap="round"/>
  <path d="M13 14.6 Q14.5 13.1 16 14.6" stroke="#FFF7F5" stroke-width="0.9" fill="none" stroke-linecap="round"/>
  <circle cx="7" cy="17.6" r="1.15" fill="#F4A6A0" opacity="0.85"/>
  <circle cx="17" cy="17.6" r="1.15" fill="#F4A6A0" opacity="0.85"/>
  <path d="M9 17.6 Q12 20.4 15 17.6" stroke="#FFF7F5" stroke-width="1" fill="none" stroke-linecap="round"/>
`;

const variants = [
  {
    label: "1. เงาใต้หยด",
    desc: "เพิ่มเงานุ่มๆ ใต้ตัวหยด ให้รู้สึกลอยเหนือพื้นผิวเล็กน้อย",
    defs: `<filter id="f1" x="-50%" y="-20%" width="200%" height="160%"><feDropShadow dx="0" dy="2.2" stdDeviation="1.4" flood-color="#5A1B15" flood-opacity="0.35"/></filter>`,
    fill: "#9A3B33",
    extraAttr: `filter="url(#f1)"`,
  },
  {
    label: "2. ไล่เฉดสี",
    desc: "ไล่เฉดจากสว่างบนซ้ายไปเข้มล่างขวา ให้ความรู้สึกทรงกลมมีปริมาตร",
    defs: `<linearGradient id="g2" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#C25B4F"/><stop offset="100%" stop-color="#6E241D"/></linearGradient>`,
    fill: "url(#g2)",
  },
  {
    label: "3. ไฮไลต์มันวาวโค้ง",
    desc: "เส้นไฮไลต์โค้งด้านซ้ายบน เหมือนแสงสะท้อนบนผิวของเหลว",
    defs: `<linearGradient id="g3" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#AD453B"/><stop offset="100%" stop-color="#7A241D"/></linearGradient>`,
    fill: "url(#g3)",
    highlight: `<path d="M7.5 8 C6.3 10.5 5.8 13 6 15.5" stroke="#FFD9CF" stroke-width="1" fill="none" stroke-linecap="round" opacity="0.55"/>`,
  },
  {
    label: "4. แสงขอบ (rim light)",
    desc: "เส้นขอบบางสว่างด้านหนึ่ง จำลองแสงส่องจากด้านข้าง",
    defs: `<linearGradient id="g4" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#A5423A"/><stop offset="100%" stop-color="#7A241D"/></linearGradient>`,
    fill: "url(#g4)",
    highlight: `<path d="${dropPath}" fill="none" stroke="#FFB6A6" stroke-width="0.5" opacity="0.5"/>`,
  },
  {
    label: "5. เอฟเฟกต์นูน (bevel)",
    desc: "ไฮไลต์บนซ้าย + เงาล่างขวาพร้อมกัน ให้ความรู้สึกนูนออกมาแบบปุ่มกด",
    defs: `<linearGradient id="g5" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#B14B41"/><stop offset="60%" stop-color="#8A2F28"/><stop offset="100%" stop-color="#6E241D"/></linearGradient>`,
    fill: "url(#g5)",
    highlight: `<path d="M7 7.5 C5.8 10.5 5.3 13.5 5.6 16.5" stroke="#FFE3D8" stroke-width="0.9" fill="none" stroke-linecap="round" opacity="0.45"/><path d="M17 16.5 C17.6 14.5 17.5 12 16.8 10" stroke="#4A150F" stroke-width="0.9" fill="none" stroke-linecap="round" opacity="0.4"/>`,
  },
  {
    label: "6. ไฮไลต์วงกลมด้านบน (แนะนำ)",
    desc: "จุดไฮไลต์วงรีมัวๆ มุมบนซ้าย คล้ายลูกแก้ว/หยดของเหลวจริง อ่านง่ายแม้ย่อเล็ก",
    defs: `<linearGradient id="g6" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#B24A40"/><stop offset="100%" stop-color="#7A241D"/></linearGradient>
      <radialGradient id="r6" cx="35%" cy="30%" r="35%"><stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55"/><stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/></radialGradient>`,
    fill: "url(#g6)",
    highlight: `<ellipse cx="8.3" cy="9" rx="2.4" ry="3.2" fill="url(#r6)" transform="rotate(-25 8.3 9)"/>`,
  },
  {
    label: "7. หยดซ้อนเงา (พารัลแลกซ์)",
    desc: "หยดจางๆ อีกใบวางเยื้องด้านหลัง ให้ความรู้สึกมีระยะห่างเชิงลึก",
    defs: ``,
    fill: "#9A3B33",
    behind: `<path d="${dropPath}" fill="#9A3B33" opacity="0.18" transform="translate(1.6,1.6) scale(0.94)" />`,
  },
  {
    label: "8. กระจกใส (glass)",
    desc: "ไล่เฉดโปร่งแสง + ไฮไลต์โค้งยาว จำลองพื้นผิวกระจก/ของเหลวใส",
    defs: `<linearGradient id="g8" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#C7695D"/><stop offset="45%" stop-color="#9A3B33"/><stop offset="100%" stop-color="#6E241D"/></linearGradient>`,
    fill: "url(#g8)",
    highlight: `<path d="M7 7 C5.6 10 5.2 13.5 5.8 17" stroke="#FFFFFF" stroke-width="1.3" fill="none" stroke-linecap="round" opacity="0.4"/><path d="M9 6.5 C8.2 8 8 9.5 8.3 11" stroke="#FFFFFF" stroke-width="0.6" fill="none" stroke-linecap="round" opacity="0.3"/>`,
  },
  {
    label: "9. เงาเข้ม+สว่างสองโทน",
    desc: "แบ่งครึ่งบน-ล่างด้วยโทนสว่าง/เข้มชัดเจน ให้เงาตกกระทบแบบทรงกลมเด่นชัด",
    defs: `<linearGradient id="g9" x1="0.2" y1="0" x2="0.8" y2="1"><stop offset="0%" stop-color="#C97165"/><stop offset="50%" stop-color="#9A3B33"/><stop offset="100%" stop-color="#5A1B15"/></linearGradient>`,
    fill: "url(#g9)",
  },
  {
    label: "10. รวมทุกเทคนิค",
    desc: "ไล่เฉด + ไฮไลต์วงรี + เงาใต้หยด ผสมกันเป็นทรง 3 มิติเต็มรูปแบบ",
    defs: `<filter id="f10" x="-50%" y="-20%" width="200%" height="160%"><feDropShadow dx="0" dy="2" stdDeviation="1.2" flood-color="#5A1B15" flood-opacity="0.3"/></filter>
      <linearGradient id="g10" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#B94F44"/><stop offset="100%" stop-color="#6E241D"/></linearGradient>
      <radialGradient id="r10" cx="35%" cy="28%" r="32%"><stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6"/><stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/></radialGradient>`,
    fill: "url(#g10)",
    extraAttr: `filter="url(#f10)"`,
    highlight: `<ellipse cx="8" cy="8.6" rx="2.2" ry="3" fill="url(#r10)" transform="rotate(-25 8 8.6)"/>`,
  },
];

const grid = document.getElementById('grid');
variants.forEach((v) => {
  const panel = document.createElement('div');
  panel.className = 'panel';
  panel.innerHTML = `
    <div class="tag">${v.label}</div>
    <p class="desc">${v.desc}</p>
    <div class="screen">
      <div class="card-icon">
        <svg width="56" height="68" viewBox="0 0 24 24">
          <defs>${v.defs || ""}</defs>
          ${v.behind || ""}
          <path d="${dropPath}" fill="${v.fill}" ${v.extraAttr || ""}/>
          ${v.highlight || ""}
          ${face}
        </svg>
      </div>
    </div>
    <div class="foot"></div>
  `;
  grid.appendChild(panel);
});
</script>
</body>
</html>
