<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>หมู่โลหิต แบบหยดเลือด</title>
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=Prompt:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--red:#9A3B33;--ink:#3A2C29;--mut:#7A6360;--line:#E3C8C3;--soft:#F3E7E4;--bg:#FDF6F4}
*{box-sizing:border-box}
body{margin:0;background:#EFE6E3;font-family:'Prompt',sans-serif;color:var(--ink);padding:24px 16px}
h1{font-family:Mitr;font-size:20px;margin:0 0 4px}.sub{color:var(--mut);font-size:13px;margin:0 0 20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:20px}
.card{background:#fff;border-radius:18px;padding:16px}
.tag{font-family:Mitr;font-size:15px;margin:0 0 2px}.desc{font-size:12px;color:var(--mut);margin:0 0 12px;min-height:34px}
.pane{border:1px solid var(--soft);border-radius:14px;padding:14px 14px 12px}
.lab{font-size:12px;color:var(--mut);margin:0 0 8px}.lab.m{margin-top:12px}
button{font-family:Mitr;cursor:pointer;-webkit-tap-highlight-color:transparent;padding:0}
.row4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.rh{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rh button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 0;font-size:14px;color:var(--ink)}
.rh button.on{background:var(--red);border-color:var(--red);color:#fff}
.hint{font-size:11px;color:var(--mut);margin:8px 0 0}
/* drop button base */
.d{border:0;background:none;position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;transition:transform .18s}
.d svg{width:100%;height:auto;display:block;overflow:visible}
.d .t{position:absolute;left:0;right:0;top:46%;text-align:center;font-family:Mitr;font-weight:500;font-size:19px;line-height:1}
.d .cap{font-family:Prompt;font-size:11px;color:var(--mut)}
.d:active{transform:scale(.94)}
/* v1 outline/solid */
.v1 path.b{fill:#fff;stroke:var(--line);stroke-width:2.5;transition:.18s}
.v1 .t{color:var(--ink)}
.v1 .d.on path.b{fill:var(--red);stroke:var(--red)}.v1 .d.on .t{color:#fff}
/* v2 glint + lift */
.v2 path.b{fill:#F7E9E6;stroke:none;transition:.2s}
.v2 .t{color:var(--red)}
.v2 .d.on{transform:translateY(-3px) scale(1.08)}
.v2 .d.on path.b{fill:var(--red)}.v2 .d.on .t{color:#fff}
.v2 .g{opacity:0;transition:.2s}.v2 .d.on .g{opacity:.45}
/* v3 fill level */
.v3 .fill{transition:transform .35s cubic-bezier(.3,1.4,.5,1);transform-origin:50% 100%;transform:scaleY(0)}
.v3 .d.on .fill{transform:scaleY(1)}
.v3 path.o{fill:#fff;stroke:var(--red);stroke-width:2.5}
.v3 .t{color:var(--ink);transition:color .2s}.v3 .d.on .t{color:#fff}
/* v4 small drop + pill */
.pill{border:1px solid var(--line);background:#fff;border-radius:999px;height:48px;display:flex;align-items:center;justify-content:center;gap:6px;color:var(--ink);font-size:16px;width:100%}
.pill svg{width:13px;height:16px;flex:none}
.pill svg path{fill:var(--line)}
.pill.on{background:var(--red);border-color:var(--red);color:#fff}.pill.on svg path{fill:#fff}
/* v5 big single drop selector */
.hero{display:flex;align-items:center;gap:14px}
.hero .big{width:84px;flex:none;position:relative}
.hero .big svg{width:100%;display:block}
.hero .big .t{position:absolute;left:0;right:0;top:44%;text-align:center;font-family:Mitr;font-size:30px;color:#fff;font-weight:500;line-height:1}
.mini{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;flex:1}
.mini button{border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px 0;font-size:16px;color:var(--ink)}
.mini button.on{background:var(--soft);border-color:var(--red);color:var(--red)}
</style></head><body>
<h1>หมู่โลหิต — แบบหยดเลือด 5 แบบ</h1>
<p class="sub">แสดงพร้อมแถว Rh ให้เห็นในกล่องจริง · ไม่มี "ไม่ทราบ" ในส่วนหมู่ · กดเล่นได้</p>
<div class="grid" id="root"></div>
<script>
const ABO=['A','B','AB','O'];
const DROP='M26 3C26 3 6 25 6 39a20 20 0 0 0 40 0C46 25 26 3 26 3z';
const GLINT='<path class="g" d="M15 40a11 11 0 0 0 8 10" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/>';
const st={v1:'A',v2:'B',v3:'AB',v4:'O',v5:'A'},rh={v1:'+',v2:'+',v3:'-',v4:'+',v5:'+'};
const root=document.getElementById('root');
function shell(id,t,d){const c=document.createElement('div');c.className='card';c.innerHTML=`<p class="tag">${t}</p><p class="desc">${d}</p><div class="pane ${id}" id="${id}"></div>`;root.append(c)}
const rhRow=id=>`<p class="lab m">Rh</p><div class="rh">${[['+','บวก (+)'],['-','ลบ (−)'],['?','ไม่ทราบ']].map(x=>`<button class="${rh[id]===x[0]?'on':''}" data-r="${x[0]}">${x[1]}</button>`).join('')}</div><p class="hint">ดูได้จากบัตรผู้บริจาค คนไทยส่วนใหญ่เป็น Rh บวก</p>`;
function bind(id,fn){const p=document.getElementById(id);p.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{st[id]=b.dataset.a;fn()});p.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{rh[id]=b.dataset.r;fn()})}
function v1(){const p=document.getElementById('v1');p.innerHTML=`<p class="lab">หมู่</p><div class="row4">${ABO.map(a=>`<button class="d ${st.v1===a?'on':''}" data-a="${a}"><svg viewBox="0 0 52 60"><path class="b" d="${DROP}"/></svg><span class="t">${a}</span></button>`).join('')}</div>${rhRow('v1')}`;bind('v1',v1)}
function v2(){const p=document.getElementById('v2');p.innerHTML=`<p class="lab">หมู่</p><div class="row4" style="padding-top:4px">${ABO.map(a=>`<button class="d ${st.v2===a?'on':''}" data-a="${a}"><svg viewBox="0 0 52 60"><path class="b" d="${DROP}"/>${GLINT}</svg><span class="t">${a}</span></button>`).join('')}</div>${rhRow('v2')}`;bind('v2',v2)}
function v3(){const p=document.getElementById('v3');p.innerHTML=`<p class="lab">หมู่</p><div class="row4">${ABO.map((a,i)=>`<button class="d ${st.v3===a?'on':''}" data-a="${a}"><svg viewBox="0 0 52 60"><defs><clipPath id="c${i}"><path d="${DROP}"/></clipPath></defs><path class="o" d="${DROP}"/><g clip-path="url(#c${i})"><rect class="fill" x="0" y="0" width="52" height="60" fill="#9A3B33"/></g></svg><span class="t">${a}</span></button>`).join('')}</div>${rhRow('v3')}`;bind('v3',v3)}
function v4(){const p=document.getElementById('v4');p.innerHTML=`<p class="lab">หมู่</p><div class="row4">${ABO.map(a=>`<button class="pill ${st.v4===a?'on':''}" data-a="${a}"><svg viewBox="0 0 52 60"><path d="${DROP}"/></svg>${a}</button>`).join('')}</div>${rhRow('v4')}`;bind('v4',v4)}
function v5(){const p=document.getElementById('v5');p.innerHTML=`<p class="lab">หมู่</p><div class="hero"><div class="big"><svg viewBox="0 0 52 60"><path d="${DROP}" fill="#9A3B33"/><path d="M15 40a11 11 0 0 0 8 10" stroke="#fff" stroke-opacity=".45" stroke-width="3" fill="none" stroke-linecap="round"/></svg><span class="t">${st.v5}</span></div><div class="mini">${ABO.map(a=>`<button class="${st.v5===a?'on':''}" data-a="${a}">${a}</button>`).join('')}</div></div>${rhRow('v5')}`;bind('v5',v5)}
shell('v1','1 · หยดโปร่ง → หยดทึบ','ทุกปุ่มเป็นหยดเลือด ตัวที่เลือกจะทึบสีแดง ตัวอื่นเป็นเส้นบางเหมือนปุ่มเดิม');
shell('v2','2 · หยดมีประกาย ยกขึ้นเมื่อเลือก','หยดสีชมพูอ่อน มีเงาสะท้อนแบบเดียวกับไอคอนแอป ตัวที่เลือกโตขึ้นและลอยขึ้นเล็กน้อย');
shell('v3','3 · เลือดเติมเต็มหยด','ตอนแตะ สีแดงไหลเติมจากก้นหยดขึ้นมา (มี animation) ดูมีชีวิตที่สุด');
shell('v4','4 · แคปซูลเดิม + หยดจิ๋ว','คงรูปแคปซูลแบบเดิม แค่เติมไอคอนหยดเล็กหน้าตัวอักษร เปลี่ยนน้อยที่สุด');
shell('v5','5 · หยดใหญ่ตัวเดียว','หยดใหญ่โชว์หมู่ที่เลือก ด้านข้างเป็นปุ่มเลือก 2×2 ประหยัดความกว้าง');
v1();v2();v3();v4();v5();
</script></body></html>
