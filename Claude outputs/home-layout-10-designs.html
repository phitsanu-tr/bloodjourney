          <div style="font-size:12px;font-weight:800;color:#9A3B33;line-height:1.3;margin-top:2px;">อีก 11 วัน</div>
          <div style="font-size:5.5px;color:#8A7370;">2 ต.ค. 2569</div>
        </div>
      </div>
      <div style="background:#9A3B33;border-radius:9px;padding:8px 10px;display:flex;align-items:center;gap:6px;color:#FFF7F5;font-size:7.5px;font-weight:700;margin-bottom:8px;">${PLUS()}บันทึกบริจาคโลหิต</div>
      <div style="background:#FFFFFF;border:1px solid #EEDEDA;border-radius:9px;padding:8px 10px;font-size:6.5px;color:#3A2C29;">🏅 อีก 1 ครั้ง ถึง "เข็มที่ระลึก 16"</div>
    `,
  },
];

const grid = document.getElementById('grid');
variants.forEach((v) => {
  const panel = document.createElement('div');
  panel.className = 'panel';
  panel.innerHTML = `
    <div class="tag">${v.label}</div>
    <p class="desc">${v.desc}</p>
    <div class="phone"><div class="phone-inner">${v.body}</div></div>
  `;
  grid.appendChild(panel);
});
