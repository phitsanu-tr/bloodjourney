<h1>คำใต้โลโก้ Blood Journey</h1>
<p class="lead">ภาพจากแอปจริง เปลี่ยนแค่คำใต้ชื่อแอป จะเห็นปุ่ม “บันทึกบริจาคโลหิต” ด้านล่างด้วย เพื่อดูว่าคำซ้ำกันหรือไม่ คำนี้ยังแสดงที่หัวแบบย่อตอนเลื่อนลง และหน้ายินยอมตอนเปิดครั้งแรก</p>
