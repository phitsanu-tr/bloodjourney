<!doctype html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>หน้าหลัก — 20 แบบว้าว</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #221514; font-family: 'Inter', sans-serif; padding: 28px 16px 60px; color: #241A18; }
  h1 { font-family: 'Mitr', sans-serif; font-size: 20px; text-align: center; margin: 0 0 4px; color: #FFF7F5; }
  .sub { text-align: center; font-size: 12.5px; color: #C9AFA9; margin: 0 0 30px; }
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 18px; max-width: 1300px; margin: 0 auto; }
  @media (max-width: 1080px) { .grid { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 680px) { .grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 460px) { .grid { grid-template-columns: 1fr; } }
  .panel { background: #FBF6F5; border-radius: 18px; overflow: hidden; box-shadow: 0 10px 26px rgba(0,0,0,0.35); }
  .tag { text-align: center; font-size: 11px; font-weight: 700; padding: 9px 6px; background: #FF6B57; color: #2A1210; }
  .desc { font-size: 10.5px; color: #8A7370; text-align: center; padding: 8px 12px 0; line-height: 1.5; min-height: 60px; }
  .phone { width: 100%; aspect-ratio: 9/17.5; margin-top: 12px; overflow: hidden; position: relative; font-family: 'Inter', sans-serif; }
  .phone-inner { position: absolute; inset: 0; overflow: hidden; padding: 14px 12px; }
  .ph-header { display:flex; align-items:center; gap:6px; margin-bottom:10px; }
  .ph-logo { width:20px; height:20px; border-radius:6px; background:linear-gradient(135deg,#B24A40,#8A2F28); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .ph-title { font-family:'Mitr',sans-serif; font-size:9px; font-weight:700; line-height:1.2; }
  .ph-sub { font-size:6.5px; color:#8A7370; }
</style>
</head>
<body>

  <div class="grid" id="grid"></div>

  {
