<!doctype html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>พรีวิวหน้าโหลด — หยดยิ้มแบบ 4</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" />
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #F3E9E7;
    font-family: 'Inter', sans-serif;
    padding: 28px 16px 60px;
  }
  h1 {
    font-family: 'Mitr', sans-serif;
    font-size: 19px;
    text-align: center;
    color: #241A18;
    margin: 0 0 4px;
  }
  .sub {
    text-align: center;
    font-size: 12.5px;
    color: #8A7370;
    margin: 0 0 28px;
  }
  .row {
    display: flex;
    gap: 20px;
    justify-content: center;
    flex-wrap: wrap;
    max-width: 900px;
    margin: 0 auto;
  }
  .panel {
    width: 100%;
    max-width: 400px;
    background: #FBF6F5;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(122,42,35,0.12);
  }
  .tag {
    text-align: center;
    font-size: 11.5px;
    font-weight: 700;
    padding: 9px 0;
    letter-spacing: 0.02em;
  }
  .tag.current { background: #E9DEDB; color: #6B5A56; }
  .tag.new { background: #9A3B33; color: #FFF7F5; }
  .screen {
    height: 460px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .spin-wrap { position: relative; width: 130px; height: 130px; display: flex; align-items: center; justify-content: center; margin-bottom: 26px; }
  .spin-ring { position: absolute; inset: 0; animation: bjSpin 2s linear infinite; }
  .spin-dot { position: absolute; top: -2px; left: 50%; transform: translateX(-50%); width: 9px; height: 9px; border-radius: 50%; background: #9A3B33; }
  @keyframes bjSpin { to { transform: rotate(360deg); } }
  .card-icon { width: 92px; height: 92px; border-radius: 26px; background: #FFFFFF; box-shadow: 0 14px 30px rgba(154,59,51,0.14); display: flex; align-items: center; justify-content: center; }
  .title { font-size: 26px; font-weight: 800; color: #241A18; text-align: center; margin-bottom: 8px; font-family: 'Mitr', 'Inter', sans-serif; }
  .subtitle { font-size: 13px; font-weight: 500; color: #9A8580; text-align: center; font-family: 'Mitr', 'Inter', sans-serif; }
</style>
</head>
<body>
  <h1>หน้าโหลดแอป — ก่อน / หลัง เปลี่ยนเป็นหยดยิ้มแบบ 4</h1>
  <p class="sub">เลย์เอาต์, สี, และแอนิเมชันหมุนเหมือนของจริงทุกอย่าง เปลี่ยนแค่หน้าไอคอนตรงกลาง</p>
  <div class="row">
    <div class="panel">
      <div class="tag current">ตอนนี้</div>
      <div class="screen">
        <div style="display:flex; flex-direction:column; align-items:center;">
          <div class="spin-wrap">
            <div class="spin-ring"><div class="spin-dot"></div></div>
            <div class="card-icon">
              <svg width="46" height="56" viewBox="0 0 24 24" fill="#9A3B33">
                <path d="M12 2 C12 2 4 12.5 4 17 C4 21 7.6 24 12 24 C16.4 24 20 21 20 17 C20 12.5 12 2 12 2 Z"/>
              </svg>
            </div>
          </div>
          <div class="title">BloodJourney</div>
          <div class="subtitle">บันทึกการบริจาคโลหิตของคุณ</div>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="tag new">แบบใหม่ — หยดยิ้มแบบ 4</div>
      <div class="screen">
        <div style="display:flex; flex-direction:column; align-items:center;">
          <div class="spin-wrap">
            <div class="spin-ring"><div class="spin-dot"></div></div>
            <div class="card-icon">
              <svg width="46" height="56" viewBox="0 0 24 24" fill="#9A3B33">
                <path d="M12 2 C12 2 4 12.5 4 17 C4 21 7.6 24 12 24 C16.4 24 20 21 20 17 C20 12.5 12 2 12 2 Z"/>
                <path d="M8 14.6 Q9.5 13.1 11 14.6" stroke="#FFF7F5" stroke-width="0.9" fill="none" stroke-linecap="round"/>
                <path d="M13 14.6 Q14.5 13.1 16 14.6" stroke="#FFF7F5" stroke-width="0.9" fill="none" stroke-linecap="round"/>
                <circle cx="7" cy="17.6" r="1.15" fill="#F4A6A0" opacity="0.85"/>
                <circle cx="17" cy="17.6" r="1.15" fill="#F4A6A0" opacity="0.85"/>
                <path d="M9 17.6 Q12 20.4 15 17.6" stroke="#FFF7F5" stroke-width="1" fill="none" stroke-linecap="round"/>
              </svg>
            </div>
          </div>
          <div class="title">BloodJourney</div>
          <div class="subtitle">บันทึกการบริจาคโลหิตของคุณ</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
