<!doctype html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>วงแหวนภารกิจ — 6 แบบ</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" />
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #F3E9E7; font-family: 'Mitr', 'Inter', sans-serif; padding: 28px 16px 60px; color: #241A18; }
  h1 { font-family: 'Mitr', sans-serif; font-size: 19px; text-align: center; margin: 0 0 4px; }
  .sub { text-align: center; font-size: 12.5px; color: #7A6360; margin: 0 0 30px; max-width: 660px; margin-left: auto; margin-right: auto; line-height: 1.6; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; max-width: 1180px; margin: 0 auto; }
  @media (max-width: 1000px) { .grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 560px) { .grid { grid-template-columns: 1fr; } }
  .panel { background: #FBF6F5; border-radius: 18px; overflow: hidden; box-shadow: 0 8px 22px rgba(122,42,35,0.10); display: flex; flex-direction: column; }
  .panel.ref .tag { background: #7A6360; }
  .tag { text-align: center; font-size: 11px; font-weight: 700; padding: 9px 6px; background: #9A3B33; color: #FFF7F5; }
  .desc { font-size: 10.5px; color: #7A6360; text-align: center; padding: 8px 12px 0; line-height: 1.5; min-height: 58px; }
  .stage { flex: 1; padding: 14px 14px 18px; display: flex; justify-content: center; }
  .phone { width: 100%; max-width: 270px; background: #FBF6F5; border-radius: 14px; padding: 12px; border: 1px solid #EEDEDA; }

  /* hero card (context, identical in every panel) */
  .hero { background: linear-gradient(135deg, #B24A40 0%, #8A2F28 100%); border-radius: 14px; padding: 13px 14px; color: #FFF7F5; }
  .hero .lbl { font-size: 9.5px; opacity: .85; }
  .hero .big { font-size: 26px; font-weight: 700; line-height: 1.1; }
  .hero .big small { font-size: 11px; font-weight: 500; }
  .hero .div { border-top: 1px solid rgba(255,247,245,.25); margin: 9px 0 8px; }
  .hero .cd { font-size: 12px; font-weight: 700; }
  .hero .date { font-size: 8.5px; color: rgba(255,247,245,.85); }
  .hero .bar { height: 4px; border-radius: 3px; background: rgba(255,247,245,.2); margin-top: 7px; overflow: hidden; }
  .hero .bar i { display: block; height: 100%; width: 22%; background: #FFF7F5; border-radius: 3px; }

  .cta { margin-top: 9px; background: #fff; border: 1px solid #EEDEDA; border-radius: 12px; padding: 8px 10px; display: flex; align-items: center; gap: 8px; font-size: 10px; font-weight: 600; color: #3A2C29; }
  .cta b { width: 22px; height: 22px; border-radius: 7px; background: #9A3B33; color: #FFF7F5; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 500; }

  /* mission card (the part being redesigned) */
  .mission { margin-top: 9px; background: #fff; border: 1px solid #EEDEDA; border-radius: 12px; padding: 10px 11px; }
  .mhead { display: flex; align-items: center; gap: 5px; font-size: 9.5px; font-weight: 600; color: #9A3B33; }
  .mtext { font-size: 10px; color: #3A2C29; margin: 5px 0 7px; }
  .mbar { height: 5px; border-radius: 3px; background: #F3EAE8; overflow: hidden; }
  .mbar i { display: block; height: 100%; width: 42.86%; background: #9A3B33; border-radius: 3px; }
  .flex { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
  .count { font-size: 9.5px; font-weight: 700; color: #9A3B33; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .count span { color: #7A6360; font-weight: 600; }
  .hl { outline: 2px dashed #D98C84; outline-offset: 3px; border-radius: 4px; }
</style>
</head>
<body>
  <h1>การ์ดภารกิจ: ตัวเลข 3/7 + วงแหวนด้านขวา — 6 แบบ</h1>
  <p class="sub">ตัวอย่างใช้ข้อมูลจริง: บริจาคแล้ว 3 ครั้ง เป้าหมายถัดไปคือ "เข็มที่ระลึก ครั้งที่ 7" และอยู่ในช่วงรออีก 70 วัน
    การ์ดแดงด้านบนเหมือนกันทุกแบบ ส่วนที่เปลี่ยนคือการ์ด "ภารกิจถัดไป" เท่านั้น เส้นประสีชมพูชี้จุดที่ต่างจากแบบเดิม</p>
  <div class="grid" id="grid"></div>

<script>
const AWARD = `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="6"/><path d="M15.5 12.9 17 22l-5-3-5 3 1.5-9.1"/></svg>`;
const DROP = (fill, stroke) => `<svg width="13" height="16" viewBox="0 0 24 28"><path d="M12 2 C12 2 4 12.5 4 18 C4 23 7.6 26 12 26 C16.4 26 20 23 20 18 C20 12.5 12 2 12 2 Z" fill="${fill}" stroke="${stroke}" stroke-width="1.8"/></svg>`;

const hero = `
  <div class="hero">
    <div class="lbl">บริจาคโลหิตสะสมทั้งหมด</div>
    <div class="big">3 <small>ครั้ง</small></div>
    <div class="div"></div>
    <div class="cd">อีก 70 วัน</div>
    <div class="date">บริจาคได้อีกครั้ง 7 ธ.ค. 2569</div>
    <div class="bar"><i></i></div>
  </div>
  <div class="cta"><b>+</b> บันทึกบริจาคโลหิต</div>`;

const head = (extra = '') => `<div class="flex"><div class="mhead">${AWARD} ภารกิจถัดไป</div>${extra}</div>`;
const text = `อีก 4 ครั้ง ถึง "เข็มที่ระลึก ครั้งที่ 7"`;
const bar = `<div class="mbar"><i></i></div>`;


const ring = ({ size = 38, stroke = 4, inner = '' } = {}) => {
  const r = (size - stroke) / 2 - 0.5, c = 2 * Math.PI * r, p = 3 / 7, h = size / 2;
  return `<div class="hl" style="position:relative;width:${size}px;height:${size}px;flex-shrink:0;">
    <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle cx="${h}" cy="${h}" r="${r}" fill="none" stroke="#F3EAE8" stroke-width="${stroke}"/>
    <circle cx="${h}" cy="${h}" r="${r}" fill="none" stroke="#9A3B33" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${c * p} ${c}" transform="rotate(-90 ${h} ${h})"/></svg>
    <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#9A3B33;font-variant-numeric:tabular-nums;line-height:1;">${inner}</div></div>`;
};
const n37 = (fs = 9) => `<span style="font-size:${fs}px;font-weight:700;">3<span style="color:#7A6360;font-weight:600;">/7</span></span>`;
const text2 = `อีก 4 ครั้ง ถึง<br>"เข็มที่ระลึก ครั้งที่ 7"`;

const variants = [
  {
    ref: true,
    label: "แบบเดิม (อ้างอิง)",
    desc: "ตอนนี้: ข้อความบอกแค่ว่าเหลืออีกกี่ครั้ง แถบสีแดงบนการ์ดขาว ทรงเดียวกับแถบในการ์ดแดง",
    mission: () => `${head()}<div class="mtext">${text}</div>${bar}`,
  },
  {
    label: "A. วงแหวนขวา มี 3/7 ในวง",
    desc: "หัวข้อกับข้อความอยู่ซ้าย วงแหวนขนาด 38px อยู่ขวา ตัวเลข 3/7 อยู่กลางวง ตัดแถบเส้นออก เรียบที่สุด",
    mission: () => `<div class="flex" style="align-items:center;"><div>${head()}<div style="font-size:10px;color:#3A2C29;line-height:1.5;margin-top:5px;">${text2}</div></div>${ring({ inner: n37(9) })}</div>`,
  },
  {
    label: "B. วงแหวนขวา + เลขใหญ่ในวง",
    desc: "เหมือนแบบ A แต่วงใหญ่ขึ้น (46px) เลข 3 ตัวใหญ่ และ /7 ตัวเล็กอยู่ข้างใต้ อ่านง่ายขึ้นบนจอเล็ก",
    mission: () => `<div class="flex" style="align-items:center;"><div>${head()}<div style="font-size:10px;color:#3A2C29;line-height:1.5;margin-top:5px;">${text2}</div></div>${ring({ size: 46, stroke: 4.5, inner: `<span style="font-size:15px;font-weight:700;">3</span><span style="font-size:8px;color:#7A6360;font-weight:600;margin-top:1px;">จาก 7</span>` })}</div>`,
  },
  {
    label: "C. วงแหวนขวา มีเหรียญในวง + 3/7 ท้ายข้อความ",
    desc: "ตัวเลข 3/7 อยู่ท้ายบรรทัดข้อความแบบเดียวกับแบบ 1 ส่วนในวงแหวนเป็นไอคอนเหรียญ สื่อว่าวงนี้คือรางวัลที่กำลังไปถึง",
    mission: () => `<div class="flex" style="align-items:center;"><div>${head()}<div style="font-size:10px;color:#3A2C29;line-height:1.5;margin-top:5px;">${text2} <span class="count" style="margin-left:2px;">${n37(9.5)}</span></div></div>${ring({ inner: AWARD })}</div>`,
  },
  {
    label: "D. วงแหวนขวา คร่อมทั้งการ์ด",
    desc: "วงแหวนวางกลางแนวตั้งของการ์ดทั้งใบ ข้างซ้ายเป็นหัวข้อ ชื่อรางวัลตัวหนา และ \"อีก 4 ครั้ง\" แยกเป็นบรรทัด อ่านเป็นลำดับชัด",
    mission: () => `<div class="flex" style="align-items:center;"><div>${head()}
      <div style="font-size:10.5px;font-weight:700;color:#3A2C29;margin-top:5px;">เข็มที่ระลึก ครั้งที่ 7</div>
      <div style="font-size:9.5px;color:#7A6360;margin-top:1px;">อีก 4 ครั้ง</div></div>${ring({ size: 42, inner: n37(10) })}</div>`,
  },
  {
    label: "E. วงแหวนขวา + แถบเดิมยังอยู่",
    desc: "เก็บแถบเส้นเดิมไว้ใต้ข้อความ และเพิ่มวงแหวน 3/7 ด้านขวา ข้อมูลครบที่สุดแต่ซ้ำกันเอง (วงกับแถบบอกเรื่องเดียวกัน)",
    mission: () => `<div class="flex" style="align-items:center;gap:10px;"><div style="flex:1;">${head()}<div class="mtext">${text}</div>${bar}</div>${ring({ size: 36, inner: n37(8.5) })}</div>`,
  },
  {
    label: "F. วงแหวนเล็ก ชิดขวาบรรทัดหัวข้อ",
    desc: "วงแหวนเล็ก 26px วางแถวเดียวกับหัวข้อ \"ภารกิจถัดไป\" ข้างวงมีเลข 3/7 ข้อความเต็มบรรทัดด้านล่าง การ์ดเตี้ยที่สุด",
    mission: () => `${head(`<div class="flex" style="gap:5px;"><span class="count">${n37(9.5)}</span>${ring({ size: 24, stroke: 3.5 })}</div>`)}<div class="mtext" style="margin-bottom:0;">${text}</div>`,
  },
];

const grid = document.getElementById('grid');
variants.forEach((v) => {
  const panel = document.createElement('div');
  panel.className = 'panel' + (v.ref ? ' ref' : '');
  panel.innerHTML = `
    <div class="tag">${v.label}</div>
    <p class="desc">${v.desc}</p>
    <div class="stage"><div class="phone">${hero}<div class="mission">${v.mission()}</div></div></div>`;
  grid.appendChild(panel);
});
</script>
</body>
</html>
