<!doctype html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<title>ตัวอย่าง: ชื่อกราฟ "จำนวนครั้งต่อปี"</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px 16px 60px; background: #FBF6F5; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans Thai", sans-serif; color: #3A2C29; }
  h1 { font-size: 15px; margin: 0 0 4px; }
  .sub { font-size: 12px; color: #7A6360; margin: 0 0 24px; line-height: 1.6; max-width: 640px; }
  .row { display: flex; flex-wrap: wrap; gap: 14px; }
  .card { background: #FFFFFF; border: 1px solid #EEDEDA; border-radius: 14px; padding: 14px; width: 220px; }
  .title { display: inline-block; font-size: 13px; font-weight: 700; color: #3A2C29; background: #F3E7E4; padding: 3px 8px; border-radius: 6px; margin-bottom: 10px; }
  .name { font-size: 12px; font-weight: 700; color: #9A3B33; margin-bottom: 4px; }
</style>
</head>
<body>
  <h1>ตัวอย่าง: ชื่อกราฟรายปี (แทนที่ "จำนวนครั้งต่อปี")</h1>
  <p class="sub">ยังไม่ได้แก้โค้ดจริง — เลือกชื่อที่สื่อความหมายชัดเจนขึ้น หรือคงชื่อเดิม</p>

  <div class="row">
    <div class="card">
      <div class="name">เดิม</div>
      <div class="title">จำนวนครั้งต่อปี</div>
    </div>

    <div class="card">
      <div class="name">แบบ A</div>
      <div class="title">จำนวนครั้งที่บริจาครายปี</div>
    </div>

    <div class="card">
      <div class="name">แบบ B</div>
      <div class="title">สถิติการบริจาครายปี</div>
    </div>

    <div class="card">
      <div class="name">แบบ C</div>
      <div class="title">จำนวนการบริจาคแต่ละปี</div>
    </div>

    <div class="card">
      <div class="name">แบบ D</div>
      <div class="title">แนวโน้มการบริจาครายปี</div>
    </div>

    <div class="card">
      <div class="name">แบบ E</div>
      <div class="title">การบริจาคย้อนหลังรายปี</div>
    </div>
  </div>

</body>
</html>
