<!doctype html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<title>ตัวอย่าง: ไอคอนปุ่มบันทึกการบริจาคโลหิต</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 16px 60px;
    background: #FBF6F5;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans Thai", sans-serif;
    color: #3A2C29;
  }
  h1 { font-size: 15px; margin: 0 0 4px; }
  .sub { font-size: 12px; color: #7A6360; margin: 0 0 22px; line-height: 1.6; }
  .option-label { font-size: 13px; font-weight: 700; color: #9A3B33; margin: 26px 0 8px; }

  .btn {
    width: 100%;
    max-width: 380px;
    padding: 13px 0;
    border-radius: 12px;
    border: none;
    font-size: 14.5px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    cursor: pointer;
    background: #9A3B33;
    color: #FFF7F5;
    font-family: inherit;
  }
</style>
</head>
<body>
  <h1>ตัวอย่าง: ไอคอนปุ่ม "บันทึกการบริจาคโลหิต"</h1>
  <p class="sub">4 แบบให้เลือก ยังไม่ได้แก้โค้ดจริง</p>

  <div class="option-label">แบบ 1 — ของเดิม (เครื่องหมายบวก)</div>
  <button class="btn">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFF7F5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    บันทึกการบริจาคโลหิต
  </button>

  <div class="option-label">แบบ 2 — บวกในวงกลม (PlusCircle)</div>
  <button class="btn">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFF7F5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
    บันทึกการบริจาคโลหิต
  </button>

  <div class="option-label">แบบ 3 — หยดเลือด + บวกเล็ก ๆ มุมขวาล่าง (ซ้อนไอคอน)</div>
  <button class="btn">
    <span style="position: relative; display: inline-flex; width: 18px; height: 18px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="#FFF7F5" stroke="none"><path d="M12 2 C12 2 4 12.5 4 17 C4 21 7.6 24 12 24 C16.4 24 20 21 20 17 C20 12.5 12 2 12 2 Z" transform="scale(0.9) translate(1.3,0)"/></svg>
      <span style="position:absolute; bottom:-3px; right:-3px; width:11px; height:11px; border-radius:50%; background:#9A3B33; border: 1.5px solid #FFF7F5; display:flex; align-items:center; justify-content:center;">
        <svg width="7" height="7" viewBox="0 0 24 24" fill="none" stroke="#FFF7F5" stroke-width="4" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </span>
    </span>
    บันทึกการบริจาคโลหิต
  </button>

  <div class="option-label">แบบ 4 — หยดเลือดเฉย ๆ (ไม่มีเครื่องหมายบวก)</div>
  <button class="btn">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="#FFF7F5" stroke="none"><path d="M12 2 C12 2 4 12.5 4 17 C4 21 7.6 24 12 24 C16.4 24 20 21 20 17 C20 12.5 12 2 12 2 Z"/></svg>
    บันทึกการบริจาคโลหิต
  </button>
</body>
</html>
